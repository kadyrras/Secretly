<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Букет для тебя</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --sky:#bfe6ff; --sky-deep:#4cb4f5; --pink:#ff2e93; --pink-soft:#ffd3e8; --ink:#14284b; --muted:#5b6f8f;
  --glow:#e6f5ff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0e1a33; --sky:#2a5f93; --sky-deep:#7cc8ff; --pink:#ff4fa6; --pink-soft:#5a2145; --ink:#f4f8ff; --muted:#a9bcdb; --glow:#16294d; }
}
:root[data-theme="dark"]{ --bg:#0e1a33; --sky:#2a5f93; --sky-deep:#7cc8ff; --pink:#ff4fa6; --pink-soft:#5a2145; --ink:#f4f8ff; --muted:#a9bcdb; --glow:#16294d; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(60vmax 60vmax at 105% -10%,var(--sky) 0,transparent 60%),
  radial-gradient(45vmax 45vmax at -10% 110%,var(--pink-soft) 0,transparent 60%);opacity:.75;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
  transition:opacity .5s ease,visibility .5s}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(30px,7vw,64px);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em;max-width:14ch}
h1 .pink{color:var(--pink)}
.hint{min-height:1.6em;margin:0 0 32px;color:var(--muted);font-size:clamp(15px,2.4vw,19px);font-weight:500}
.btns{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;max-width:100%}
button{font-family:'Unbounded',sans-serif;font-weight:500;cursor:pointer;border:0;border-radius:999px;
  transition:font-size .35s cubic-bezier(.3,1.4,.5,1),padding .35s cubic-bezier(.3,1.4,.5,1),opacity .35s,transform .15s,box-shadow .2s;
  max-width:100%;white-space:nowrap}
button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
#yes{background:var(--pink);color:#fff;padding:.9em 2.2em;font-size:20px;box-shadow:0 10px 30px -8px var(--pink)}
#yes:hover{transform:translateY(-2px)}
#yes:active{transform:scale(.97)}
#no{background:var(--sky);color:var(--ink);padding:.9em 2em;font-size:20px}
#no.gone{opacity:0;pointer-events:none;padding:0;font-size:0;margin:-8px}
/* garden screen */
#bouquet-screen{background:radial-gradient(90vmax 70vmax at 50% 100%,#1b2a55 0,#0a0e22 55%,#05060f 100%);color:#fff;justify-content:flex-start;padding-top:max(8vh,40px)}
#garden{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gtext{position:relative;z-index:2;opacity:0;transform:translateY(10px);transition:opacity 1.2s 3s,transform 1.2s 3s}
.show .gtext{opacity:1;transform:none}
.gtext h2{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(26px,6vw,52px);margin:0 0 6px;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(5,6,15,.9)}
.gtext p{margin:0;color:#cfe3ff;font-weight:500;text-shadow:0 2px 16px rgba(5,6,15,.9)}
#again{position:absolute;z-index:2;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(5,6,15,.55);color:#fff;border:2px solid #ff4fa6;padding:.7em 1.6em;font-size:15px;opacity:0;transition:opacity .8s 4s,background .2s;backdrop-filter:blur(6px)}
.show #again{opacity:1}
#again:hover{background:#ff2e93}
@media (prefers-reduced-motion:reduce){.gtext,#again{transition-delay:0s}}
</style>
</head>
<body>
<main class="screen" id="ask">
  <h1>Хочешь <span class="pink">букет</span> цветов?</h1>
  <p class="hint" id="hint" aria-live="polite">Он совсем не завянет.</p>
  <div class="btns">
    <button id="yes" type="button">Да</button>
    <button id="no" type="button">Нет</button>
  </div>
</main>

<section class="screen hidden" id="bouquet-screen" aria-live="polite">
  <canvas id="garden" aria-hidden="true"></canvas>
  <div class="gtext"><h2>Это тебе!</h2><p>Целый сад цветов, которые не завянут.</p></div>
  <button id="again" type="button">Показать ещё раз</button>
</section>

<script>
(function(){
  var ask=document.getElementById('ask'), scr=document.getElementById('bouquet-screen');
  var yes=document.getElementById('yes'), no=document.getElementById('no'), hint=document.getElementById('hint');
  var again=document.getElementById('again'), cv=document.getElementById('garden'), cx=cv.getContext('2d');
  var msgs=['Он совсем не завянет.','Точно нет?','Подумай ещё немного…','Ну пожалуйста.','Кнопка «Да» очень старается.','Она уже почти на весь экран.','Нажми «Да» — она так хочет.'];
  var n=0, W=0, H=0, flowers=[], blades=[], raf=0, t0=0;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  function sizes(){
    var vw=Math.min(window.innerWidth,900);
    yes.style.fontSize=Math.min(20+n*9, vw/4.2+(n>6?40:0))+'px';
    yes.style.padding=(.9+n*.06)+'em '+(2.2+n*.25)+'em';
    var ns=Math.max(20-n*2.6,0);
    if(ns<4){ no.classList.add('gone'); no.setAttribute('aria-hidden','true'); no.tabIndex=-1; }
    else { no.style.fontSize=ns+'px'; no.style.padding='.9em 2em'; }
  }
  no.addEventListener('click',function(){ n++; sizes(); hint.textContent=msgs[Math.min(n,msgs.length-1)]; });
  yes.addEventListener('click',function(){
    ask.classList.add('hidden'); scr.classList.remove('hidden');
    scr.classList.remove('show'); void scr.offsetWidth; scr.classList.add('show');
    start();
  });
  again.addEventListener('click',function(){
    stop(); scr.classList.add('hidden'); scr.classList.remove('show');
    n=0; no.classList.remove('gone'); no.removeAttribute('aria-hidden'); no.tabIndex=0;
    yes.removeAttribute('style'); no.removeAttribute('style'); hint.textContent=msgs[0];
    ask.classList.remove('hidden');
  });

  var PAL={pink:[330,100,66],soft:[340,85,84],white:[210,45,97],blue:[205,95,74]};
  function clamp(v){return v<0?0:v>1?1:v}
  function eo(p){return 1-Math.pow(1-p,3)}
  function back(p){var c=1.6;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}
  function R(a,b){return a+Math.random()*(b-a)}

  function build(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=scr.clientWidth; H=scr.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    var N=Math.round(Math.min(Math.max(W/6.5,55),170)); flowers=[]; blades=[];
    for(var i=0;i<N;i++){
      var q=Math.random(), type=q<.28?'pink':q<.5?'soft':q<.65?'white':q<.77?'blue':q<.9?'sun':'bud';
      var d=Math.random();
      flowers.push({x:R(0,W),top:H*R(.1,.72),depth:d,type:type,r:(type==='sun'?1.15:1)*(8+d*22),
        delay:reduce?0:R(.2,6.5),dur:reduce?.01:R(2,3.4),lean:R(-60,60),phase:R(0,6.28),rot:R(0,6.28)});
    }
    flowers.sort(function(a,b){return a.depth-b.depth});
    var B=Math.round(Math.min(Math.max(W/5,60),170));
    for(var k=0;k<B;k++) blades.push({x:R(-10,W+10),h:R(H*.04,H*.15),lean:R(-22,22),phase:R(0,6.28),delay:reduce?0:R(.1,3),l:R(22,40)});
  }

  function rose(c,r){
    var p=PAL[c];
    for(var L=0;L<4;L++){
      var dist=r*.5*(1-L*.24), pr=r*.56*(1-L*.2);
      cx.fillStyle='hsl('+p[0]+','+p[1]+'%,'+(p[2]-L*6)+'%)';
      cx.strokeStyle='rgba(60,0,30,.12)'; cx.lineWidth=.8;
      for(var k=0;k<6;k++){
        var a=k*Math.PI/3+L*.55;
        cx.beginPath(); cx.arc(Math.cos(a)*dist,Math.sin(a)*dist,pr,0,6.283); cx.fill(); cx.stroke();
      }
    }
    cx.fillStyle='hsl('+p[0]+','+p[1]+'%,'+(p[2]-26)+'%)';
    cx.beginPath(); cx.arc(0,0,r*.12,0,6.283); cx.fill();
  }
  function sun(r){
    for(var ring=0;ring<2;ring++){
      cx.fillStyle=ring?'hsl(42,100%,48%)':'hsl(47,100%,58%)';
      var cnt=16;
      for(var k=0;k<cnt;k++){
        cx.save(); cx.rotate(k*6.283/cnt+ring*.2);
        cx.beginPath(); cx.ellipse(0,-r*(.78-ring*.1),r*.17,r*(.32-ring*.04),0,0,6.283); cx.fill(); cx.restore();
      }
    }
    cx.fillStyle='#4a2a0c'; cx.beginPath(); cx.arc(0,0,r*.45,0,6.283); cx.fill();
    cx.fillStyle='#8a5a1e';
    for(var i=0;i<14;i++){ var a=i*2.4, rr=r*.38*Math.sqrt(i/14); cx.beginPath(); cx.arc(Math.cos(a)*rr,Math.sin(a)*rr,r*.04,0,6.283); cx.fill(); }
  }
  function bud(r){
    cx.fillStyle='hsl(335,70%,42%)'; cx.beginPath(); cx.arc(0,0,r*.5,0,6.283); cx.fill();
    cx.fillStyle='hsla(335,90%,75%,.5)'; cx.beginPath(); cx.arc(-r*.12,-r*.12,r*.2,0,6.283); cx.fill();
  }

  function frame(now){
    if(!t0) t0=now; var t=(now-t0)/1000;
    cx.clearRect(0,0,W,H);
    for(var i=0;i<flowers.length;i++){
      var f=flowers[i], p=clamp((t-f.delay)/f.dur); if(p<=0) continue;
      var g=eo(p), al=.4+.6*f.depth, sw=Math.sin(t*.9+f.phase)*7*f.depth;
      cx.strokeStyle='hsla(140,50%,'+(32+f.depth*12)+'%,'+al+')'; cx.lineWidth=1+f.depth*1.6; cx.lineCap='round';
      cx.beginPath();
      var tx=0,ty=0;
      for(var k=0;k<=22;k++){
        var u=g*k/22; tx=f.x+(f.lean+sw)*u*u; ty=H+8+(f.top-H-8)*u;
        if(k===0) cx.moveTo(tx,ty); else cx.lineTo(tx,ty);
      }
      cx.stroke();
      var b=clamp((p-.7)/.3); if(b<=0) continue;
      var sc=Math.max(back(b),0);
      cx.save(); cx.globalAlpha=al; cx.translate(tx,ty); cx.rotate(f.rot+sw*.02); cx.scale(sc,sc);
      if(f.depth>.85){ cx.shadowColor=f.type==='sun'?'rgba(255,200,0,.5)':'rgba(255,120,190,.45)'; cx.shadowBlur=14; }
      if(f.type==='sun') sun(f.r); else if(f.type==='bud') bud(f.r); else rose(f.type,f.r);
      cx.restore();
    }
    for(var j=0;j<blades.length;j++){
      var bl=blades[j], pg=eo(clamp((t-bl.delay)/1.6)); if(pg<=0) continue;
      var s2=Math.sin(t*1.1+bl.phase)*6;
      cx.strokeStyle='hsl(135,55%,'+bl.l*.7+'%)'; cx.lineWidth=2.2;
      cx.beginPath(); cx.moveTo(bl.x,H+2);
      cx.quadraticCurveTo(bl.x+bl.lean*.3,H-bl.h*pg*.55,bl.x+bl.lean+s2,H-bl.h*pg); cx.stroke();
    }
    raf=requestAnimationFrame(frame);
  }
  function start(){ stop(); build(); t0=0; raf=requestAnimationFrame(frame); }
  function stop(){ if(raf) cancelAnimationFrame(raf); raf=0; }
  window.addEventListener('resize',function(){ if(raf){ var keep=t0; build(); t0=keep; } });
})();
</script>
</body>
</html>
